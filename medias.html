    <style>

/* Reset some default styles */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* Gallery container */
.gallery {
    display: grid;
    grid-template-columns: repeat(4, 1fr); /* 4 columns */
    grid-template-rows: repeat(4, 250px); /* 4 rows, each 250px high */
    gap: 20px; /* Space between images, both horizontally and vertically */
    padding: 20px;
}

/* Gallery item styles */
.gallery-item {
    position: relative;
    overflow: hidden;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
}

/* Image styles */
.gallery-item img {
    width: 100%;
    height: 100%;
    object-fit: cover; /* Ensure images cover the div without distortion */
    transition: transform 0.3s ease; /* Smooth zoom effect */
}

/* Description box styles */
.description {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    background-color: rgba(0, 0, 0, 0.6);
    color: white;
    padding: 10px;
    text-align: center;
    font-size: 16px;
    opacity: 0;
    transition: opacity 0.3s ease;
}

/* Optional: Add a hover effect */
.gallery-item:hover img {
    transform: scale(1.05); /* Slight zoom on hover */
}

.gallery-item:hover .description {
    opacity: 1; /* Show description on hover */
}

.text-center {
     text-align: center;
  }

        

</style>
</head>
